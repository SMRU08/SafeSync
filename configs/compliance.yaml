# configs/compliance.yaml — RAKSHYA VISION Phase 5
# Worker Tracking, PPE Association & Compliance Configuration

tracking:
  tracker: "bytetrack"
  track_high_thresh: 0.25      # Detection confidence threshold for first-stage ByteTrack matching
  track_low_thresh: 0.10       # Detection confidence threshold for second-stage matching (low-conf recovery)
  new_track_thresh: 0.25       # Confidence required to initialize a new track ID
  track_buffer: 30             # Number of frames to keep a lost track in memory
  match_thresh: 0.80           # IoU threshold for track matching
  min_box_area: 100            # Minimum pixel area for a valid person bounding box

association:
  helmet:
    vertical_roi_top: -0.05    # Relative to person box height (allow slightly above top of head)
    vertical_roi_bottom: 0.30  # Head / upper shoulders zone
    max_lateral_offset: 0.25   # Maximum relative lateral offset outside person width
    min_containment_ratio: 0.20
  safety_vest:
    vertical_roi_top: 0.15     # Torso zone top
    vertical_roi_bottom: 0.70  # Torso zone bottom
    max_lateral_offset: 0.20
    min_containment_ratio: 0.30
  gloves:
    vertical_roi_top: 0.35     # Lower arm / hand zone top
    vertical_roi_bottom: 0.90  # Lower arm / hand zone bottom
    max_lateral_offset: 0.35   # Allow hands extending laterally
    min_containment_ratio: 0.15
  safety_footwear:
    vertical_roi_top: 0.70     # Lower leg / feet zone top
    vertical_roi_bottom: 1.05  # Feet zone bottom (allow slight floor contact margin)
    max_lateral_offset: 0.25
    min_containment_ratio: 0.15

temporal:
  confirmation_frames: 3         # Consecutive/accumulated detections required to confirm PRESENT
  missing_detection_tolerance: 5 # Tolerated missed detections before transitioning to ABSENT
  history_window_frames: 30      # Sliding history window per active worker track
  prune_lost_after_frames: 60    # Purge worker history after 60 frames of inactivity

required_ppe:
  helmet: true
  safety_vest: true
  gloves: true
  safety_footwear: true

occlusion:
  edge_margin_px: 20             # Boundary cutoff margin (pixels near frame edge flag UNKNOWN)
  inter_person_overlap_thresh: 0.35 # IoU between workers triggering partial occlusion state
