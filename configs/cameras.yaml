# configs/cameras.yaml — RAKSHYA VISION Phase 10 Step 5
# Camera and Zone Metadata Configuration
# Supports RTSP, USB webcams, recorded video files, and synthetic streams.
# Passwords must be referenced via environment variables, never hardcoded in plaintext.

cameras:
  - id: "camera_01"
    name: "CCTV - Production Floor South"
    zone_id: "production_floor"
    source: "0"  # USB or integrated webcam index 0, or rtsp:// stream
    source_type: "usb"  # "rtsp", "usb", "file", "synthetic"
    enabled: true
    fps_target: 30
    resolution: "1280x720"
    timeout_seconds: 5.0
    reconnect_policy:
      max_retries: 5
      initial_delay_seconds: 1.0
      max_delay_seconds: 15.0

  - id: "camera_02"
    name: "Mobile Phone Camera"
    zone_id: "storage_area"
    # Option 1 (Wi-Fi Stream): Use free "IP Webcam" app -> start server -> put your phone IP:
    source: "http://192.168.1.105:8080/video"
    source_type: "http"
    # Option 2 (USB Cable): Use "1" for USB device index and source_type: "usb"
    # source: "1"
    # source_type: "usb"
    enabled: false  # Set to true once you start the mobile camera stream
    fps_target: 20
    resolution: "1280x720"
    timeout_seconds: 5.0
    reconnect_policy:
      max_retries: 5
      initial_delay_seconds: 1.0
      max_delay_seconds: 10.0

  - id: "camera_03"
    name: "CCTV - High Voltage Electrical Room"
    zone_id: "electrical_room"
    source: "synthetic://electrical_room"
    source_type: "synthetic"
    enabled: false
    fps_target: 20
    resolution: "640x480"
    timeout_seconds: 3.0
    reconnect_policy:
      max_retries: 5
      initial_delay_seconds: 1.0
      max_delay_seconds: 10.0

  - id: "camera_04"
    name: "CCTV - Loading Dock Outer"
    zone_id: "loading_dock"
    source: "rtsp://${CAMERA_USERNAME}:${CAMERA_PASSWORD}@192.168.1.104:554/stream1"
    source_type: "rtsp"
    enabled: false
    fps_target: 25
    resolution: "1920x1080"
    timeout_seconds: 5.0
    reconnect_policy:
      max_retries: 10
      initial_delay_seconds: 2.0
      max_delay_seconds: 30.0

  # Camera 05: Android Phone via IP Webcam or DroidCam (HTTP Stream over Wi-Fi)
  # To use: Install "IP Webcam" app on Android, tap "Start Server", set IP address below, and change enabled: true
  # - id: "camera_android_wifi"
  #   name: "Android Phone Cam (Wi-Fi Stream)"
  #   zone_id: "production_floor"
  #   source: "http://192.168.1.100:8080/video"
  #   source_type: "http"
  #   enabled: false
  #   fps_target: 20
  #   resolution: "1280x720"
  #   timeout_seconds: 5.0
  #   reconnect_policy:
  #     max_retries: 5
  #     initial_delay_seconds: 1.0
  #     max_delay_seconds: 10.0

  # Camera 06: Android Phone via USB Cable (DirectShow UVC device index)
  # To use: Connect phone via USB -> Select "Webcam" mode on Android notification -> set source: "1" (or device index)
  # - id: "camera_android_usb"
  #   name: "Android Phone Cam (USB Webcam)"
  #   zone_id: "production_floor"
  #   source: "1"
  #   source_type: "usb"
  #   enabled: false
  #   fps_target: 30
  #   resolution: "1280x720"
  #   timeout_seconds: 5.0
  #   reconnect_policy:
  #     max_retries: 5
  #     initial_delay_seconds: 1.0
  #     max_delay_seconds: 10.0

zones:
  - id: "production_floor"
    name: "Production Floor"
    description: "Main assembly and fabrication area"
    # Optional polygon ROI in normalized [0..1] or pixel coordinates.
    # If omitted, all coordinates within camera_01 map to this zone.

  - id: "storage_area"
    name: "Storage Area"
    description: "Warehouse aisle and racked material bins"

  - id: "electrical_room"
    name: "Electrical Room"
    description: "Substation and transformer enclosure"
    # Example normalized polygon ROI for high-risk transformer zone
    polygon_normalized:
      - [0.1, 0.1]
      - [0.9, 0.1]
      - [0.9, 0.9]
      - [0.1, 0.9]

  - id: "loading_dock"
    name: "Loading Dock"
    description: "Logistics bay and exterior staging"
