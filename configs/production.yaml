# configs/production.yaml — SafeSync Centralized Production Configuration
# Safe defaults for real-world edge and facility deployments.
# Sensitive secrets (passwords, JWT secret keys, RTSP credentials) MUST be set via environment variables.

environment: "production"

application:
  name: "SafeSync"
  version: "1.0.0"
  description: "AI Vision-Based Safety Monitoring System"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

database:
  dialect: "sqlite"  # "sqlite" for edge gateway, "postgresql" for centralized enterprise
  url: "sqlite:///./safesync.db"
  pool_size: 5
  max_overflow: 10
  pool_timeout_seconds: 30

model:
  active_name: "ppe_fire_smoke_v3"
  registry_path: "models/registry/model_registry.yaml"
  enforce_checksum: true
  target_status: "production"

camera:
  config_file: "configs/cameras.yaml"
  reconnect_attempts: 5
  reconnect_delay_seconds: 3.0
  default_target_fps: 30

inference:
  device: "auto"  # "auto", "cpu", "0" (CUDA)
  confidence_threshold: 0.25
  iou_threshold: 0.45
  image_size: 384
  batch_size: 1

tracking:
  engine: "bytetrack"
  track_high_thresh: 0.30
  track_low_thresh: 0.10
  new_track_thresh: 0.40
  track_buffer: 30
  match_thresh: 0.80

compliance:
  config_file: "configs/compliance.yaml"
  required_ppe:
    helmet: true
    safety_vest: true
    gloves: true
    safety_footwear: true
  temporal:
    confirmation_frames: 3
    missing_detection_tolerance: 5
  rule_strictness: "MANDATORY_UNKNOWN_NO_VIOLATION"

hazards:
  config_file: "configs/hazard.yaml"
  fire_confidence: 0.35
  smoke_confidence: 0.30
  confirmation_frames: 5
  clear_frames: 10
  iou_threshold: 0.30

risk:
  policy_file: "configs/risk_policy.yaml"

alerts:
  policy_file: "configs/alert_policy.yaml"
  anti_flood:
    enabled: true
    deduplication_window_seconds: 60
    escalation_persistence_seconds: 30.0

logging:
  level: "INFO"
  format: "text"
  log_file: "outputs/logs/safesync.log"
  max_bytes: 10485760  # 10 MB
  backup_count: 5

retention:
  evidence_days: 30
  incident_history_days: 90
  incidents_days: 30
  alerts_days: 30
  hazard_events_days: 30
  worker_compliance_events_days: 30
  alert_history_days: 90
  max_evidence_storage_gb: 20

security:
  auth_enabled: false
  jwt_algorithm: "HS256"
  jwt_expiration_minutes: 480  # 8 hours
  rate_limit_per_minute: 120
  allowed_upload_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".webp"
    - ".mp4"
    - ".avi"
    - ".mkv"
  max_upload_size_mb: 100

monitoring:
  metrics_enabled: true
  health_heartbeat_interval_seconds: 15
